<!--
  Reach — version history
  v1.0  Initial build: 31 stretches, session builder, play mode, localStorage playlists
  v1.1  Fixed save/rename using inline UI instead of browser prompt()
  v1.2  Beep pattern: single drum at segment start, triple quick drum at segment end
  v1.3  Added 19 stretch illustrations (RepDB) + attribution footer
  v1.4  Added version tag in header
  v1.5  Removed stretch images (inaccurate matches), removed muscle subtitle from
        cards, tightened card padding, and shrank duration pill size
  v1.6  Added home screen icon (apple-touch-icon, favicon, manifest) — green
        tile using the header's leaf mark, plus standalone web-app meta tags
  v1.7  Added a session preview screen (list + total time) before playing,
        shown after saving or loading a playlist; added a 5-sec "get ready"
        lead-in; fixed beep pattern so each drum sound only plays once per
        transition (1 drum starts a stretch, 3 quick drums end it and start
        the rest); removed the header tagline; fixed the playlist rename
        row layout; moved "Stretch details" off the overlapping progress text
  v1.8  Made beeps survive backgrounding (matches the fix used in TRACKR):
        unlocks iOS's audio session on the Play tap, keeps a silent oscillator
        alive so the AudioContext isn't auto-suspended, re-resumes audio on
        return-to-tab/next-touch/resume-from-pause, holds a screen wake lock
        during playback, and fully closes the context when a session ends
  v1.9  Seeded a one-off recommended playlist, "Post Run Stretch" (hamstrings,
        quads, calves, hip flexors, glutes — 2 min each), added once to
        My Playlists on next load; won't reappear if deleted or renamed
  v2.0  Seeded three more 20-min recommended playlists: "Full Body Stretch",
        "Back Release", and "Upper Body Stretch" — each added once to
        My Playlists, same one-time-only behaviour as Post Run Stretch
  v2.1  Pumped up the drum beep volume — routed through a hotter gain stage
        into a compressor/limiter (rather than just cranking a plain gain,
        which would clip/crackle), so it's noticeably louder without turning
        harsh, plus a slightly higher starting pitch for more presence
        on phone speakers
  v2.2  Made the session preview fully editable — change any stretch's
        duration, remove one, or add another right there, with an "Add a
        stretch" panel browsing everything not yet in the session. Removed
        the old "Review" drawer/button from the build tab, since preview now
        covers that
-->

<style>
  :root{

const AREA_ORDER = ["Hips & Glutes","Hamstrings & Legs","Back & Spine","Shoulders & Chest","Neck","Arms & Wrists"];
const DURATIONS = [1,2,3];

/* ============ STATE ============ */
// selections: { [stretchId]: durationMinutes }
let selections = {};

/* ============ RENDER: BUILD TAB ============ */
function renderBuildTab(){
  const root = document.getElementById('build-tab');
  root.innerHTML = '';
  AREA_ORDER.forEach(area=>{
    const items = STRETCHES.filter(s=>s.area===area);
    if(!items.length) return;
    const section = document.createElement('section');
    section.className='area-section';
    section.innerHTML = `<div class="area-head"><h2>${area}</h2><span class="count">${items.length}</span></div>`;
    const grid = document.createElement('div');
    grid.className='card-grid';
    items.forEach(s=>grid.appendChild(renderCard(s)));
    section.appendChild(grid);
    root.appendChild(section);
  });
}

function renderCard(s){
  const card = document.createElement('div');
  card.className = 'stretch-card' + (selections[s.id] ? ' selected' : '');
  card.dataset.id = s.id;

  const chips = DURATIONS.map(d=>{
    const active = selections[s.id]===d ? 'active' : '';
    return `<button class="dur-chip ${active}" data-min="${d}">${d} min${s.sides ? '/side' : ''}</button>`;
  }).join('');

  card.innerHTML = `
    <div class="row-top">
      <div>
        <h3>${s.name}</h3>
      </div>
      <button class="info-btn" aria-label="Details">i</button>
    </div>
    <div class="details">
      <h4>How to do it</h4>
      <ul>${s.how.map(x=>`<li>${x}</li>`).join('')}</ul>
      <h4>Muscles targeted</h4>
      <ul>${s.muscles.map(x=>`<li>${x}</li>`).join('')}</ul>
      <h4>Key benefits</h4>
      <ul><li>${s.benefits}</li></ul>
    </div>
    <div class="dur-row">
      <span class="label">Duration</span>
      ${chips}
      ${s.sides ? '<span class="sides-tag">both sides</span>' : '<span class="sides-tag">single hold</span>'}
    </div>
  `;

  card.querySelector('.info-btn').addEventListener('click', ()=>{
    card.querySelector('.details').classList.toggle('open');
  });

  card.querySelectorAll('.dur-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const min = parseInt(btn.dataset.min,10);
      if(selections[s.id]===min){
        delete selections[s.id];
      } else {
        selections[s.id]=min;
      }
      renderBuildTab();
      renderSessionBar();
    });
  });

  return card;
}

/* ============ SESSION BAR ============ */
function sessionMinutesFor(items){
  return Object.entries(items).reduce((sum,[id,min])=>{
    const s = STRETCHES.find(x=>x.id==id);
    return sum + min * (s.sides ? 2 : 1);
  },0);
}
function sessionMinutes(){
  return sessionMinutesFor(selections);
}

function renderSessionBar(){
  const bar = document.getElementById('sessionBar');
  const ids = Object.keys(selections);
  if(ids.length===0){
    bar.style.display='none';
    return;
  }
  bar.style.display='block';
  const mins = sessionMinutes();
  document.getElementById('sessionTotal').textContent = `${mins} min`;
  document.getElementById('sessionSub').textContent = `${ids.length} stretch${ids.length>1?'es':''} selected`;
  document.getElementById('playBtn').disabled = false;
}

/* ============ TABS ============ */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('build-tab').style.display = tab==='build' ? 'block':'none';
    document.getElementById('playlists-tab').style.display = tab==='playlists' ? 'block':'none';
    if(tab==='playlists') renderPlaylistsTab();
  });
});

/* ============ PLAYLISTS (localStorage) ============ */
const STORAGE_KEY = 'reach_playlists_v1';
function loadPlaylists(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function savePlaylists(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

document.getElementById('saveBtn').addEventListener('click', ()=>{
  if(Object.keys(selections).length===0) return;
  const panel = document.getElementById('savePanel');
  const input = document.getElementById('savePanelInput');
  input.value = `${sessionMinutes()} min`;
  panel.classList.add('open');
  input.focus();
  input.select();
});

document.getElementById('savePanelCancel').addEventListener('click', ()=>{
  document.getElementById('savePanel').classList.remove('open');
});

function confirmSave(){
  const input = document.getElementById('savePanelInput');
  const name = input.value.trim() || `${sessionMinutes()} min`;
  const list = loadPlaylists();
  const newEntry = {
    id: Date.now().toString(),
    name,
    createdAt: new Date().toISOString(),
    items: {...selections}
  };
  list.push(newEntry);
  savePlaylists(list);
  document.getElementById('savePanel').classList.remove('open');
  openPreview(newEntry.items);
}
document.getElementById('savePanelConfirm').addEventListener('click', confirmSave);
document.getElementById('savePanelInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') confirmSave();
});

function renderPlaylistsTab(){
  const root = document.getElementById('playlists-tab');
  const list = loadPlaylists();
  if(list.length===0){
    root.innerHTML = `<div class="empty-state">No saved playlists yet.<br>Build a session and hit Save.</div>`;
    return;
  }
  root.innerHTML = list.slice().reverse().map(p=>{
    const mins = Object.entries(p.items).reduce((sum,[id,min])=>{
      const s = STRETCHES.find(x=>x.id==id);
      return sum + min*(s.sides?2:1);
    },0);
    return `<div class="playlist-card" data-id="${p.id}">
      <div class="title-area">
        <h3>${p.name}</h3>
        <div class="meta">${Object.keys(p.items).length} stretches · ${mins} min</div>
      </div>
      <div class="actions">
        <button class="load">Load</button>
        <button class="rename">Rename</button>
        <button class="del">Delete</button>
      </div>
    </div>`;
  }).join('');

  root.querySelectorAll('.playlist-card').forEach(card=>{
    const id = card.dataset.id;
    card.querySelector('.load').addEventListener('click', ()=>{
      const list = loadPlaylists();
      const p = list.find(x=>x.id===id);
      if(!p) return;
      openPreview(p.items);
    });
    card.querySelector('.del').addEventListener('click', ()=>{
      let list = loadPlaylists();
      list = list.filter(x=>x.id!==id);
      savePlaylists(list);
      renderPlaylistsTab();
    });
    card.querySelector('.rename').addEventListener('click', ()=>{
      const list = loadPlaylists();
      const p = list.find(x=>x.id===id);
      if(!p) return;
      const titleArea = card.querySelector('.title-area');
      const actions = card.querySelector('.actions');
      actions.style.display = 'none';
      titleArea.innerHTML = `<div class="name-edit">
        <input type="text" value="${p.name.replace(/"/g,'&quot;')}">
        <button class="confirm-rename">Save</button>
        <button class="cancel-rename">Cancel</button>
      </div>`;
      const input = titleArea.querySelector('input');
      input.focus();
      input.select();
      function doRename(){
        const newName = input.value.trim() || p.name;
        const list2 = loadPlaylists();
        const p2 = list2.find(x=>x.id===id);
        if(p2){ p2.name = newName; savePlaylists(list2); }
        renderPlaylistsTab();
      }
      titleArea.querySelector('.confirm-rename').addEventListener('click', doRename);
      titleArea.querySelector('.cancel-rename').addEventListener('click', ()=> renderPlaylistsTab());
      input.addEventListener('keydown', (e)=>{
        if(e.key==='Enter') doRename();
        if(e.key==='Escape') renderPlaylistsTab();
      });
    });
  });
}

/* ============ AUDIO: low drum beep ============ */
// Keeping beeps reliable across the whole session — including when the phone
// switches audio apps (e.g. Spotify) or the screen locks — takes more than
// just creating an AudioContext. iOS in particular will suspend the context,
// or silence it entirely if another app owns the audio session, unless we:
//   1. Unlock a real <audio> element first (iosUnmuteHack). Playing it inside
//      the initial tap is what flips iOS's audio session from "Ambient" (gets
//      ducked/silenced by other apps and the mute switch) to "Playback"
//      (keeps going alongside Spotify etc).
//   2. Create/resume the AudioContext synchronously inside that same tap —
//      any awaited step before this breaks the "user gesture" chain on iOS.
//   3. Keep a silent (zero-gain) oscillator running for the whole session so
//      iOS doesn't auto-suspend an "idle" context between beeps.
//   4. Re-resume the context (and the keep-alive) whenever the page becomes
//      visible again, and on the next touch — visibilitychange alone isn't
//      treated as a user gesture on iOS, so resume() there can silently fail
//      until a real tap follows it.
//   5. Fully close the context when a session ends, so the next session
//      starts a fresh one inside a fresh gesture rather than reusing a stale,
//      possibly-stuck-suspended one.
let audioCtx = null;
let masterGain = null;
let compressorNode = null;
let silentKeepAliveNode = null;
let sessionWakeLock = null;
let audioSessionActive = false;

async function ensureAudioCtx(){
  try{
    const unmute = document.getElementById('iosUnmuteHack');
    if(unmute && unmute.paused){
      unmute.volume = 0.001;
      await unmute.play().catch(()=>{});
    }
  }catch(e){}
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    try{ audioCtx = new Ctx(); }catch(e){ return null; }
  }
  ensureAudioGraph(audioCtx);
  if(audioCtx.state !== 'running'){
    await audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}
function startSilentKeepAlive(ctx){
  if(silentKeepAliveNode) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    silentKeepAliveNode = osc;
  }catch(e){}
}
function stopSilentKeepAlive(){
  if(silentKeepAliveNode){ try{ silentKeepAliveNode.stop(); }catch(e){} silentKeepAliveNode = null; }
}
// A compressor/limiter after a hotter gain stage makes the drum noticeably
// louder and punchier on a phone speaker without the harsh crackle you'd get
// from just cranking a plain GainNode past ~1.0.
function ensureAudioGraph(ctx){
  if(compressorNode) return;
  try{
    compressorNode = ctx.createDynamicsCompressor();
    compressorNode.threshold.value = -24;
    compressorNode.knee.value = 24;
    compressorNode.ratio.value = 12;
    compressorNode.attack.value = 0.003;
    compressorNode.release.value = 0.2;
    masterGain = ctx.createGain();
    masterGain.gain.value = 1.8;
    masterGain.connect(compressorNode).connect(ctx.destination);
  }catch(e){ masterGain = null; compressorNode = null; }
}
function drumOutput(ctx){
  ensureAudioGraph(ctx);
  return masterGain || ctx.destination;
}
async function acquireSessionWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    sessionWakeLock = await navigator.wakeLock.request('screen');
    sessionWakeLock.addEventListener('release', ()=>{ sessionWakeLock = null; });
  }catch(e){ /* non-fatal */ }
}
function releaseSessionWakeLock(){
  if(sessionWakeLock){ try{ sessionWakeLock.release(); }catch(e){} sessionWakeLock = null; }
}
function endAudioSession(){
  audioSessionActive = false;
  stopSilentKeepAlive();
  releaseSessionWakeLock();
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx = null; }
  masterGain = null;
  compressorNode = null;
  try{ const u = document.getElementById('iosUnmuteHack'); if(u) u.pause(); }catch(e){}
}
// The page coming back to the foreground (e.g. after switching to Spotify)
// isn't itself a user gesture, so resume() here can silently fail on iOS —
// but it's free to try, and it covers Android/desktop reliably.
document.addEventListener('visibilitychange', ()=>{
  if(!audioSessionActive || document.visibilityState !== 'visible') return;
  if(!sessionWakeLock) acquireSessionWakeLock();
  if(audioCtx && audioCtx.state !== 'running'){
    audioCtx.resume().then(()=>{
      if(!silentKeepAliveNode) startSilentKeepAlive(audioCtx);
    }).catch(()=>{});
  }
});
// A touch IS a genuine user gesture on iOS, so this is the reliable fallback
// that re-activates audio the moment you tap back into the page.
document.addEventListener('touchstart', ()=>{
  if(!audioSessionActive || !audioCtx) return;
  if(audioCtx.state !== 'running'){
    audioCtx.resume().then(()=>{
      if(!silentKeepAliveNode) startSilentKeepAlive(audioCtx);
    }).catch(()=>{});
  }
}, {passive:true});

function playDrum(){
  if(!audioCtx) return;
  const schedule = ()=>{
    try{
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(170, t0);
      osc.frequency.exponentialRampToValueAtTime(55, t0 + 0.22);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(1.3, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
      osc.connect(gain).connect(drumOutput(audioCtx));
      osc.start(t0);
      osc.stop(t0 + 0.34);
    }catch(e){ /* ignore */ }
  };
  if(audioCtx.state !== 'running') audioCtx.resume().then(schedule).catch(()=>{});
  else schedule();
}
function playDrumTriple(){
  if(!audioCtx) return;
  const schedule = ()=>{
    try{
      [0, 0.16, 0.32].forEach(offset=>{
        const t0 = audioCtx.currentTime + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(170, t0);
        osc.frequency.exponentialRampToValueAtTime(55, t0 + 0.14);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(1.3, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
        osc.connect(gain).connect(drumOutput(audioCtx));
        osc.start(t0);
        osc.stop(t0 + 0.22);
      });
    }catch(e){ /* ignore */ }
  };
  if(audioCtx.state !== 'running') audioCtx.resume().then(schedule).catch(()=>{});
  else schedule();
}

/* ============ PLAY MODE ============ */
let sequence = [];   // flattened segments
let seqIndex = 0;
let remainingMs = 0;
let segmentDurationMs = 0;
let tickTimer = null;
let isPaused = false;
let lastTick = null;

function buildSequence(){
  const seq = [];
  const ids = Object.keys(selections);
  ids.forEach(id=>{
    const s = STRETCHES.find(x=>x.id==id);
    const min = selections[id];
    if(s.sides){
      seq.push({stretch:s, side:'Right side', seconds:min*60});
      seq.push({rest:true, seconds:10});
      seq.push({stretch:s, side:'Left side', seconds:min*60});
      seq.push({rest:true, seconds:10});
    } else {
      seq.push({stretch:s, side:null, seconds:min*60});
      seq.push({rest:true, seconds:10});
    }
  });
  // remove trailing rest
  if(seq.length && seq[seq.length-1].rest) seq.pop();
  return seq;
}

document.getElementById('playBtn').addEventListener('click', ()=>{
  if(Object.keys(selections).length===0) return;
  openPreview(selections);
});

/* ============ SESSION PREVIEW (fully editable) ============ */
// This screen replaced the old "Review" drawer — it's now the one place to
// fine-tune a session: change a duration, remove a stretch, or add another,
// all before hitting Play.
let previewItems = {};
let previewAddOpen = false;

function openPreview(items){
  previewItems = {...items};
  previewAddOpen = false;
  syncSelectionsFromPreview();
  document.getElementById('previewOverlay').classList.add('open');
}
function closePreview(){
  document.getElementById('previewOverlay').classList.remove('open');
}
// Keep the build tab + session bar in sync with whatever is edited here, so
// nothing looks stale if the user backs out of preview without playing.
function syncSelectionsFromPreview(){
  selections = {...previewItems};
  renderBuildTab();
  renderSessionBar();
  renderPreviewList();
}

function renderPreviewList(){
  const ids = Object.keys(previewItems);
  const mins = sessionMinutesFor(previewItems);
  document.getElementById('previewTotal').textContent = ids.length
    ? `${mins} min · ${ids.length} stretch${ids.length===1?'':'es'}`
    : 'No stretches yet';

  const itemsList = document.getElementById('previewItemsList');
  if(ids.length===0){
    itemsList.innerHTML = `<div class="preview-empty">Add a stretch below to build this session.</div>`;
  } else {
    itemsList.innerHTML = ids.map(id=>{
      const s = STRETCHES.find(x=>x.id==id);
      const min = previewItems[id];
      const chips = DURATIONS.map(d=>{
        const active = min===d ? 'active' : '';
        return `<button class="dur-chip ${active}" data-id="${id}" data-min="${d}">${d} min${s.sides?'/side':''}</button>`;
      }).join('');
      return `<div class="preview-item">
        <div>
          <div class="pi-name">${s.name}</div>
          <div class="pi-dur-row">
            ${chips}
            <span class="pi-sides-tag">${s.sides ? 'both sides' : 'single hold'}</span>
          </div>
        </div>
        <button class="pi-remove" data-id="${id}">Remove</button>
      </div>`;
    }).join('');
    itemsList.querySelectorAll('.dur-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        previewItems[btn.dataset.id] = parseInt(btn.dataset.min, 10);
        syncSelectionsFromPreview();
      });
    });
    itemsList.querySelectorAll('.pi-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        delete previewItems[btn.dataset.id];
        syncSelectionsFromPreview();
      });
    });
  }

  document.getElementById('startPlayBtn').disabled = ids.length===0;
  const addToggle = document.getElementById('previewAddToggle');
  addToggle.textContent = previewAddOpen ? '– Hide stretch list' : '+ Add a stretch';
  document.getElementById('previewAddPanel').classList.toggle('open', previewAddOpen);
  if(previewAddOpen) renderPreviewAddPanel();
}

function renderPreviewAddPanel(){
  const panel = document.getElementById('previewAddPanel');
  const remaining = STRETCHES.filter(s=>!(s.id in previewItems));
  if(remaining.length===0){
    panel.innerHTML = `<div class="preview-empty">Every stretch is already in this session.</div>`;
    return;
  }
  panel.innerHTML = AREA_ORDER.map(area=>{
    const items = remaining.filter(s=>s.area===area);
    if(!items.length) return '';
    return `<div class="preview-add-area">${area}</div>` + items.map(s=>
      `<div class="preview-add-item">
        <span>${s.name}</span>
        <button class="add" data-id="${s.id}" aria-label="Add">+</button>
      </div>`
    ).join('');
  }).join('');
  panel.querySelectorAll('button.add').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      previewItems[btn.dataset.id] = 1;
      syncSelectionsFromPreview();
    });
  });
}

document.getElementById('previewAddToggle').addEventListener('click', ()=>{
  previewAddOpen = !previewAddOpen;
  renderPreviewList();
});
document.getElementById('closePreviewBtn').addEventListener('click', closePreview);
document.getElementById('startPlayBtn').addEventListener('click', ()=> startPlayback(previewItems));

async function startPlayback(items){
  selections = {...items};
  const built = buildSequence();
  if(!built.length) return;

  // ---- synchronous audio unlock: must happen before any await ----
  const unmute = document.getElementById('iosUnmuteHack');
  if(unmute && unmute.paused){ unmute.volume = 0.001; unmute.play().catch(()=>{}); }
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx){ try{ audioCtx = new Ctx(); }catch(e){} }
  }
  if(audioCtx) ensureAudioGraph(audioCtx);
  if(audioCtx && audioCtx.state !== 'running'){ audioCtx.resume().catch(()=>{}); }
  audioSessionActive = true;
  acquireSessionWakeLock();
  // ------------------------------------------------------------------

  sequence = [{ready:true, seconds:5}, ...built];
  seqIndex = -1;
  closePreview();
  document.getElementById('playControls').style.display='flex';
  openPlayOverlay();
  advanceSegment();

  // Safe to await now that playback has already started.
  if(audioCtx){
    if(audioCtx.state !== 'running') await audioCtx.resume().catch(()=>{});
    startSilentKeepAlive(audioCtx);
  }
}

function openPlayOverlay(){
  document.getElementById('playOverlay').classList.add('open');
}
function closePlayOverlay(){
  document.getElementById('playOverlay').classList.remove('open');
  clearInterval(tickTimer);
  endAudioSession();
}
document.getElementById('exitPlayBtn').addEventListener('click', ()=>{
  if(confirm('End this session?')) closePlayOverlay();
});

const CIRCUMFERENCE = 2*Math.PI*44;

function advanceSegment(){
  seqIndex++;
  if(seqIndex >= sequence.length){
    showComplete();
    return;
  }
  const seg = sequence[seqIndex];
  segmentDurationMs = seg.seconds*1000;
  remainingMs = segmentDurationMs;
  isPaused = false;
  if(!seg.ready && !seg.rest){
    playDrum(); // 1 drum: starts a stretch (also marks the end of a transition, if one preceded it)
  }
  renderSegmentUI(seg);
  startTicking();
}

function stretchCountLabel(){
  const totalStretches = sequence.filter(s=>!s.rest && !s.ready).length;
  const doneIndex = sequence.slice(0,seqIndex+1).filter(s=>!s.rest && !s.ready).length;
  return `Stretch ${Math.max(doneIndex,1)} of ${totalStretches}`;
}

function renderSegmentUI(seg){
  document.getElementById('progressText').textContent = seg.ready ? 'Get ready' : stretchCountLabel();
  document.getElementById('pauseBtn').textContent = '❚❚';
  const nameEl = document.getElementById('playStretchName');
  const sideEl = document.getElementById('playSideTag');
  const restTag = document.getElementById('restTag');
  const infoBtn = document.getElementById('playInfoBtn');

  if(seg.ready){
    restTag.style.display='none';
    nameEl.textContent = 'Get ready';
    sideEl.textContent = 'Starting shortly';
    infoBtn.style.display='none';
  } else if(seg.rest){
    restTag.style.display='block';
    nameEl.textContent = 'Rest';
    sideEl.textContent = 'Next up in a moment';
    infoBtn.style.display='none';
  } else {
    restTag.style.display='none';
    nameEl.textContent = seg.stretch.name;
    sideEl.textContent = seg.side || '';
    infoBtn.style.display='inline-block';
    infoBtn.onclick = ()=>openDetailsSheet(seg.stretch);
  }

  const next = sequence[seqIndex+1];
  const upNext = document.getElementById('upNext');
  if(next){
    upNext.textContent = next.rest ? `Then rest` : `Up next: ${next.stretch.name}${next.side ? ' — '+next.side : ''}`;
  } else {
    upNext.textContent = 'Last one — nice work almost done';
  }
}

function startTicking(){
  clearInterval(tickTimer);
  lastTick = Date.now();
  updateTimerDisplay();
  tickTimer = setInterval(()=>{
    if(isPaused) { lastTick = Date.now(); return; }
    const now = Date.now();
    const delta = now - lastTick;
    lastTick = now;
    remainingMs -= delta;
    if(remainingMs <= 0){
      remainingMs = 0;
      updateTimerDisplay();
      const endingSeg = sequence[seqIndex];
      if(endingSeg && !endingSeg.ready && !endingSeg.rest){
        playDrumTriple(); // 3 quick drums: ends the stretch and starts the transition (or the session, if last)
      }
      advanceSegment();
      return;
    }
    updateTimerDisplay();
  }, 100);
}

function updateTimerDisplay(){
  const secs = Math.ceil(remainingMs/1000);
  const m = Math.floor(secs/60);
  const s = secs%60;
  document.getElementById('timeLabel').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const frac = segmentDurationMs ? remainingMs/segmentDurationMs : 0;
  document.getElementById('fgCircle').style.strokeDasharray = CIRCUMFERENCE;
  document.getElementById('fgCircle').style.strokeDashoffset = CIRCUMFERENCE * (1-frac);
}

document.getElementById('pauseBtn').addEventListener('click', ()=>{
  isPaused = !isPaused;
  document.getElementById('pauseBtn').textContent = isPaused ? '▶' : '❚❚';
  if(!isPaused){
    lastTick = Date.now();
    ensureAudioCtx().then(ctx=>{ if(ctx && !silentKeepAliveNode) startSilentKeepAlive(ctx); });
  }
});
document.getElementById('skipFwdBtn').addEventListener('click', ()=>{
  advanceSegment();
});
document.getElementById('skipBackBtn').addEventListener('click', ()=>{
  remainingMs = segmentDurationMs;
  updateTimerDisplay();
});

function showComplete(){
  clearInterval(tickTimer);
  endAudioSession();
  const body = document.getElementById('playBody');
  document.getElementById('progressText').textContent = 'Session complete';
  document.getElementById('playControls').style.display='none';
  body.innerHTML = `
    <div class="complete-screen">
      <div class="big-check">✓</div>
      <h2>Nice reach.</h2>
      <div class="side-tag">Session finished — ${Math.round(sessionMinutes())} min of stretching logged.</div>
    </div>
  `;
}

document.getElementById('exitPlayBtn').addEventListener('click', function handler(){});

/* Reset controls visibility when reopening */
const origPlayBtnClick = document.getElementById('playBtn');

/* ============ DETAILS SHEET (during play) ============ */
function openDetailsSheet(s){
  const sheet = document.getElementById('detailsSheet');
  sheet.innerHTML = `
    <h3>${s.name}</h3>
    <h4>How to do it</h4>
    <ul>${s.how.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h4>Muscles targeted</h4>
    <ul>${s.muscles.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h4>Key benefits</h4>
    <ul><li>${s.benefits}</li></ul>
    <button class="sheet-close">Close</button>
  `;
  sheet.classList.add('open');
  document.getElementById('scrim').classList.add('open');
  sheet.querySelector('.sheet-close').addEventListener('click', closeDetailsSheet);
}
function closeDetailsSheet(){
  document.getElementById('detailsSheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
document.getElementById('scrim').addEventListener('click', closeDetailsSheet);

/* ============ SEED: recommended playlists ============ */
// Each has its own flag so it's offered exactly once and never reappears if
// deleted or renamed, and adding a new recommended playlist later never
// re-triggers the ones already seeded.
const SEED_PLAYLISTS = [
  {
    flag: 'reach_seeded_post_run_v1',
    name: 'Post Run Stretch',
    // Forward Fold Hamstring Stretch, Standing Quad Stretch,
    // Toes on Wall Calf Stretch, Lunging Hip Flexor Stretch, Figure Four Stretch
    items: {2:2, 6:2, 4:2, 12:2, 7:2}
  },
  {
    flag: 'reach_seeded_full_body_v1',
    name: 'Full Body Stretch',
    // Forward Fold Hamstring, Standing Quad, Lunging Hip Flexor, Cat Cow,
    // Kneeling Side Bend, Seated Neck Release, Chest and Shoulder, Triceps
    items: {2:2, 6:2, 12:2, 28:2, 13:1, 20:1, 24:2, 5:1}
  },
  {
    flag: 'reach_seeded_back_release_v1',
    name: 'Back Release',
    // Kneeling Side Bend, Sphinx Pose, Extended Puppy Pose, Knee to Chest,
    // Reclined Spinal Twist, Pretzel Stretch, Upper Back Stretch, Cat Cow
    items: {13:2, 16:1, 17:1, 18:2, 19:2, 22:2, 25:1, 28:1}
  },
  {
    flag: 'reach_seeded_upper_body_v1',
    name: 'Upper Body Stretch',
    // Lying Pectoral, Seated Shoulder Squeeze, Shoulder Stretch Across Chest,
    // Standing Doorway Pectoral, Seated Neck Release, Triceps, Biceps, Upper Back
    items: {9:2, 11:2, 27:1, 31:2, 20:1, 5:1, 26:2, 25:2}
  },
];
function seedDefaultPlaylists(){
  let list = null;
  SEED_PLAYLISTS.forEach(seed=>{
    if(localStorage.getItem(seed.flag)) return;
    localStorage.setItem(seed.flag, '1');
    if(!list) list = loadPlaylists();
    if(list.some(p=>p.name===seed.name)) return;
    list.push({
      id: 'seed-' + seed.flag + '-' + Date.now().toString(),
      name: seed.name,
      createdAt: new Date().toISOString(),
      items: seed.items
    });
  });
  if(list) savePlaylists(list);
}
seedDefaultPlaylists();

/* ============ INIT ============ */
renderBuildTab();
renderSessionBar();
</script>
